name: Reproduce and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --extra before
      - run: uv run --locked --extra before ruff check .
      - run: uv run --locked --extra before ruff format --check .
      - name: Reproduce released evaluator
        run: uv run --locked --extra before python reproduce.py --output results/before.json
      - name: Reproduce proposed evaluator
        run: >-
          uv run --locked --extra after python reproduce.py --after
          --baseline results/before.json --output site/results.json
      - name: Verify published measurements and images
        run: |
          git diff --exit-code -- site/results.json
          uv run --locked --extra after pytest tests.py -q
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: reproduce
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
